name: Build desktop preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - run: python -m pip install '.[desktop,build]'
      - name: Build Windows preview
        if: runner.os == 'Windows'
        run: python packaging/build_desktop.py --preview
      - name: Build macOS preview
        if: runner.os == 'macOS'
        run: python packaging/build_desktop.py --preview --dmg
      - name: Run compiled Windows preview smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath './dist/Song2AgostiniPreview/Song2AgostiniPreview.exe' -ArgumentList '--smoke-test', '--screenshot', 'work/desktop-preview.png' -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
      - name: Run compiled macOS preview smoke
        if: runner.os == 'macOS'
        run: dist/Song2AgostiniPreview.app/Contents/MacOS/Song2AgostiniPreview --smoke-test --screenshot work/desktop-preview.png
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-preview-${{ matrix.os }}
          path: |
            dist/Song2AgostiniPreview*
            work/desktop-preview.png
          if-no-files-found: error
          retention-days: 14
