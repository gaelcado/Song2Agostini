<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark"><title>Song2Agostini</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head>
<body data-view="idle">
<main>
  <section id="pane-input" class="pane-input" aria-label="Choisir un audio">
    <label class="drop" id="dropzone" for="audio">
      <span class="wave" aria-hidden="true"></span>
      <strong id="file-label">Déposez un morceau</strong>
      <span id="file-detail">WAV, FLAC ou MP3 · ou cliquez pour choisir</span>
      <input id="audio" type="file" accept=".wav,.flac,.mp3,audio/wav,audio/flac,audio/mpeg">
    </label>
    <button id="generate" class="primary" disabled><span id="generate-label">Générer la partition</span><kbd aria-hidden="true">↵</kbd></button>
    <p class="fine"><span class="dot" aria-hidden="true"></span>Tout reste sur cet ordinateur · 200 Mo et 30 min maximum</p>
  </section>

  <section id="pane-run" class="pane-run" aria-label="Génération en cours" aria-live="polite">
    <div class="run-head">
      <span class="wave" aria-hidden="true"></span>
      <div><h1 id="run-title">Préparation…</h1><p id="elapsed" class="muted">Calcul sur cet ordinateur</p></div>
    </div>
    <ol id="steps" class="steps"></ol>
    <div class="meter"><div class="meter-line"><span id="progress-label">Préparation…</span><span id="percent">0 %</span></div><progress id="progress" max="100" value="0" aria-label="Progression de la génération"></progress><p id="progress-note" class="muted">Le calcul local peut prendre plusieurs minutes.</p></div>
  </section>

  <section id="pane-done" class="pane-done" aria-labelledby="output-title">
    <figure class="sheet">
      <img id="pdf-preview" alt="Première page de la partition de batterie">
      <p id="preview-unavailable" class="muted" hidden>L’aperçu est indisponible. Ouvrez ou téléchargez le PDF complet.</p>
      <figcaption><span>Première page</span><a id="open-pdf" target="_blank" rel="noopener">Ouvrir le PDF complet ↗</a></figcaption>
    </figure>
    <aside class="side">
      <button id="again" class="back" type="button">← Nouvelle partition</button>
      <header><h1 id="output-title">Votre partition</h1><span id="draft-badge" class="badge" title="La fidélité musicale n’est pas validée automatiquement : écoutez en suivant la partition.">Brouillon</span></header>
      <div class="downloads" id="downloads"></div>
      <section class="block" aria-labelledby="facts-title"><h2 id="facts-title">Ce que l’application a compris</h2><dl id="facts" class="facts"></dl></section>
      <details id="warnings" class="block" open><summary id="warnings-title">À vérifier à l’écoute</summary><ul id="warning-list"></ul></details>
      <details class="block"><summary>Comment c’est fait</summary><ol id="recap" class="steps recap"></ol><p id="compute-note" class="muted"></p></details>
    </aside>
  </section>

  <p id="error" class="error" role="alert" hidden></p>
</main>
</body></html>
